<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting To Sanity Studio</title>
    <meta http-equiv="refresh" content="0; url=https://brad.sanity.studio" />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f7f7f7;
        color: #161616;
      }

      .card {
        max-width: 760px;
        margin: 3rem auto;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 1.5rem;
      }

      a {
        color: #161616;
      }
    </style>
    <script>
      window.location.replace('https://brad.sanity.studio');
    </script>
  </head>
  <body>
    <main class="card">
      <h1>Redirecting To Sanity Studio</h1>
      <p>
        If you are not redirected automatically, open
        <a href="https://brad.sanity.studio" rel="noopener noreferrer">brad.sanity.studio</a>.
      </p>
    </main>
  </body>
</html>
