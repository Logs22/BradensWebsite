<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Braden Website Admin</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f7f7f7;
        color: #161616;
      }

      .card {
        max-width: 760px;
        margin: 3rem auto;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 1.5rem;
      }

      h1 {
        margin-top: 0;
      }

      code {
        background: #f0f0f0;
        padding: 0.15rem 0.3rem;
        border-radius: 4px;
      }

      .links {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }

      a {
        display: inline-block;
        text-decoration: none;
        border: 1px solid #161616;
        color: #161616;
        border-radius: 999px;
        padding: 0.6rem 1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Content Editing Has Moved To Sanity</h1>
      <p>
        This site no longer uses Sveltia/Decap CMS. Content is now managed in
        Sanity Studio, including bulk media upload for portfolio images.
      </p>
      <div class="links">
        <a href="https://23vvbmgr.sanity.studio" rel="noopener noreferrer" target="_blank">Open Hosted Studio</a>
      </div>
      <p>Run locally from this repository:</p>
      <p><code>cd website</code> then <code>npm run dev</code></p>
    </main>
  </body>
</html>
